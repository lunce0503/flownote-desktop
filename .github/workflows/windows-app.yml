name: Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      check_only:
        description: Run native contract checks without packaging or staging smoke
        type: boolean
        default: false
      verify_existing:
        description: Verify released 1.3.2 portable notes without packaging
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm run check

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_existing != true && inputs.check_only != true
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged apps on staging
        shell: pwsh
        env:
          FLOWNOTE_WINDOWS_WEB_SCOPE: shell
        run: |
          $version = node -p "require('./package.json').version"
          $installDir = Join-Path $env:RUNNER_TEMP 'FlownoteInstalled'
          $setup = Join-Path $PWD "release/Flownote-Setup-$version-x64.exe"
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir 'resources/installed-by-nsis'))) { throw 'NSIS update mode marker missing' }
          $portableDir = Join-Path $env:RUNNER_TEMP 'FlownotePortable'
          Expand-Archive "release/Flownote-Portable-$version-x64.zip" $portableDir
          node scripts/shared-web-smoke.mjs (Join-Path $installDir 'Flownote.exe') (Join-Path $portableDir 'Flownote.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: flownote-windows-x64
          path: |
            release/Flownote-Setup-*.exe
            release/Flownote-Portable-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  existing-notes:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_existing == true && inputs.check_only != true
    needs: check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download and verify released portable
        shell: pwsh
        run: |
          $name = 'Flownote-Portable-1.3.2-x64.zip'
          $base = 'https://github.com/lunce0503/flownote/releases/download/windows-v1.3.2'
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $checksumHash = (Get-FileHash SHA256SUMS.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksumHash -ne '1889616b2458c72ecc1ef016f96aa145f74f43afe901215c151564b31353bce0') { throw 'Released checksum file mismatch' }
          Invoke-WebRequest "$base/$name" -OutFile $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '5ffd9ab721b46a35193ef61180d0de8efd8b3523980e03510bf542cb8d60d370') { throw 'Released portable mismatch' }
          $lines = Get-Content SHA256SUMS.txt
          if (!($lines -contains "$hash  $name")) { throw 'Released portable checksum entry missing' }
          Expand-Archive $name (Join-Path $env:RUNNER_TEMP 'FlownotePortable')
      - name: Verify current staging notes in released portable
        shell: pwsh
        env:
          FLOWNOTE_WINDOWS_WEB_SCOPE: notes
        run: |
          node scripts/shared-web-smoke.mjs (Join-Path $env:RUNNER_TEMP 'FlownotePortable/Flownote.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Released portable notes smoke failed' }
